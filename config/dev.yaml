entity:
  processed_dir: data/processed

opensearch:
  index_name: gleif_entities_v1
  # One shard holds the ~1 GB match index comfortably and suits a free-tier
  # cluster capped at 20 shards. Takes effect on `make index --recreate`.
  number_of_shards: 1
  number_of_replicas: 0
  bulk_batch_size: 2000
  refresh_interval_during_bulk: "-1"
  refresh_interval_after_bulk: "1s"

# The hosted demo cluster allows 20 shards in total (5 are Aiven's own). With
# the small read indexes packed together and superseded generations pruned,
# serving takes 4 shards live and 8 while a publish is staged.
serving:
  keep_previous_generation: false
  packed:
    - gleif_relationships
    - 13f_filers
    - match_decisions
    - nport_funds
    - fund_series
    - securities
    - 13dg_ownership
    - sec_adv_documents
    - sec_adv_pages
    - sec_adv_pdfs
    - xbrl_facts
    - xbrl_issuers
    - adv_firms
    - form_d_offerings
    - security_ownership
    - short_volume
    - fails_to_deliver

search:
  default_size: 20

workspace:
  poll_seconds: 2
  lease_seconds: 90
  heartbeat_seconds: 15
  max_attempts: 3
  max_turns: 50
  max_events: 100

benchmark:
  output_dir: data/benchmark
  seed: 42
  eval_sample_size: 5000
  min_core_tokens: 3
  max_confusable_group_size: 10

# Entity Q&A agent (er.agent) - API keys live only in .env, never here.
# The chat model's provider is the first four settings. For OpenCode Go instead:
#   model: deepseek-v4.1-flash
#   base_url: https://opencode.ai/inference/go/openai/v1
#   api_key_env: OPENCODE_API_KEY
#   session_header: x-opencode-session
agent:
  model: deepseek/deepseek-v4.1-flash
  base_url: https://openrouter.ai/api/v1
  api_key_env: OPENROUTER_API_KEY
  session_header: x-session-id
  mcp_server_command: ["python", "-m", "er.cli.mcp_server"]
  max_tool_turns: 8
  # Retry a model call that failed transiently (dropped connection, 429/502/
  # 503/504) - never a 400, which fails identically every time.
  retries: 2
  retry_backoff_seconds: 0.75
  connect_timeout_seconds: 10
  # Per tool result, as sent to the model. A large issuer's full profile can be
  # ~7.6M chars (30k+ ISIN identifiers inlined), which the API rejects; over this,
  # long lists are trimmed with elisions marked and the model is told.
  max_tool_result_chars: 40000
  # Post-answer verification (er.agent.verifier). Jev is a decision model, not
  # a chat model: it answers this fixed set of typed questions about the
  # finished answer in one pass and returns calibrated probabilities. The
  # thresholds below are the whole verified/partial/unverified rule - retune
  # the badge here, not in code.
  verifier:
    enabled: true
    model: typesafe/jev-1.13
    decisions_url: https://openrouter.ai/api/alpha/decisions
    timeout_seconds: 30
    # Retry a Jev call that failed transiently (couldn't connect, dropped,
    # 429/502/503/504); give up on connecting after a few seconds.
    connect_timeout_seconds: 5
    retries: 2
    retry_backoff_seconds: 0.5
    # Jev's input limit is 32,768 tokens; this JSON runs ~2 chars/token.
    max_state_chars: 50000
    # Calibrated against a labelled answer set, not picked by feel - see
    # experiments/006-jev-answer-verification.md. A faithful answer reads
    # ~0.8 on `grounded`, so a higher-looking bar here would mark almost
    # every correct answer "partially verified".
    grounded_min: 0.70
    not_contradicted_min: 0.87
    citations_supported_min: 0.70
    scope_respected_min: 0.75
    # The one veto: below this the answer conflicts with the records and is
    # reported unverified whatever else it scored.
    not_contradicted_floor: 0.50

# Deterministic matcher tuning - change these to retune scoring without touching code.
matching:
  candidate_pool_size: 20
  weights:
    name_exact: 100
    name_core_exact: 60
    name_ratio: 40
    jurisdiction_exact: 25
    country_exact: 15
    postcode_exact: 35
    postcode_prefix_exact: 15
    city_exact: 10
    fund_number_exact: 20
    registration_id_exact: 250
  penalties:
    fund_number_conflict: 100
    master_conflict: 80
    feeder_conflict: 80
    registration_id_conflict: 250
  decision:
    auto_match_min_score: 140
    auto_match_min_gap: 30
    review_min_score: 90
    tie_tolerance: 5

# Brand/family discovery tuning (er.family) - a different operation from matching:
# retrieves and groups a SET of related legal entities rather than resolving to one.
family:
  candidate_pool_size: 100
