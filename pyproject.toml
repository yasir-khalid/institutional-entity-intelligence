[project]
name = "er"
version = "0.1.0"
description = "Institutional entity intelligence - GLEIF-anchored entity resolution"
requires-python = ">=3.11"
dependencies = [
    "lxml>=5.2",
    "pyarrow>=17.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "opensearch-py>=2.7",
    "rapidfuzz>=3.9",
    "unidecode>=1.3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/er"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
